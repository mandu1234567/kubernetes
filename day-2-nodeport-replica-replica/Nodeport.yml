apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service
spec:
  type: NodePort
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80        # Port exposed within the cluster
      targetPort: 8080 # Port the application container listens on
      nodePort: 30007  # Specific external port on each node (optional)   
