apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: httpd-app1

  template:
    metadata:
      labels:
        app: httpd-app1

    spec:
      containers:
      - name: httpd
        image: httpd:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-app1-service
spec:
  selector:
    app: httpd-app1
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
